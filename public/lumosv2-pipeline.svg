<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="100%" role="img" aria-labelledby="lumosv2-pipeline-title lumosv2-pipeline-desc" font-family="-apple-system, system-ui, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <title id="lumosv2-pipeline-title">LumosV2 5단계 파이프라인</title>
  <desc id="lumosv2-pipeline-desc">트랜잭션 재실행, 부분 추출, Pseudocode 변환, PoC 검증 루프, 근본 원인 분석으로 이어지는 5단계 자동화 파이프라인 다이어그램.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .label { font-size: 12px; fill: #3d3d3a; }
    .muted { font-size: 12px; fill: #5f5e5a; }
    .tag   { font-size: 12px; fill: #888780; }
    .step-title { font-size: 14px; font-weight: 600; }
    .step-sub   { font-size: 12px; }
    .arrow      { stroke: #73726c; stroke-width: 1.5; fill: none; }
    .box-input  { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.5; }
    .box-step   { fill: #e6f1fb; stroke: #185fa5; stroke-width: 0.5; }
    .box-core   { fill: #faece7; stroke: #993c1d; stroke-width: 0.5; }
    .box-out    { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 0.5; }
    .box-tool   { fill: none; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    .loop-arrow { stroke: #993c1d; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
  </style>

  <!-- Input -->
  <text class="tag" x="40" y="32">Input</text>
  <g>
    <rect class="box-input" x="40" y="44" width="140" height="44" rx="8"/>
    <text x="110" y="62" text-anchor="middle" class="step-title" fill="#44443f">Seed transaction</text>
    <text x="110" y="80" text-anchor="middle" class="muted">공격 tx 해시</text>
  </g>
  <line class="arrow" x1="180" y1="66" x2="218" y2="66" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <g>
    <rect class="box-step" x="220" y="44" width="200" height="44" rx="8"/>
    <text x="320" y="62" text-anchor="middle" class="step-title" fill="#0c447c">① 트랜잭션 재실행</text>
    <text x="320" y="80" text-anchor="middle" class="step-sub" fill="#185fa5">trace 수집 · cEFG 생성</text>
  </g>
  <g>
    <rect class="box-tool" x="450" y="38" width="190" height="56" rx="6"/>
    <text class="tag"   x="460" y="56">Tools</text>
    <text class="muted" x="460" y="74">Foundry cast run</text>
    <text class="muted" x="460" y="90">RPC debug_traceTransaction</text>
  </g>
  <line class="arrow" x1="320" y1="88" x2="320" y2="128" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g>
    <rect class="box-step" x="220" y="130" width="200" height="44" rx="8"/>
    <text x="320" y="148" text-anchor="middle" class="step-title" fill="#0c447c">② 공격 관련 부분 추출</text>
    <text x="320" y="166" text-anchor="middle" class="step-sub" fill="#185fa5">수천 → 60~70개 호출</text>
  </g>
  <g>
    <rect class="box-tool" x="450" y="120" width="190" height="68" rx="6"/>
    <text class="tag"   x="460" y="138">Filter rules</text>
    <text class="muted" x="460" y="154">• 공격자 EOA 직접 호출</text>
    <text class="muted" x="460" y="170">• 공격자 배포 컨트랙트</text>
    <text class="muted" x="460" y="186">• DELEGATECALL 위임</text>
  </g>
  <line class="arrow" x1="320" y1="174" x2="320" y2="214" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g>
    <rect class="box-step" x="220" y="216" width="200" height="44" rx="8"/>
    <text x="320" y="234" text-anchor="middle" class="step-title" fill="#0c447c">③ Bytecode → Pseudocode</text>
    <text x="320" y="252" text-anchor="middle" class="step-sub" fill="#185fa5">Dual IR 보존</text>
  </g>
  <g>
    <rect class="box-tool" x="450" y="210" width="190" height="56" rx="6"/>
    <text class="tag"   x="460" y="228">Output</text>
    <text class="muted" x="460" y="244">Solidity-like code</text>
    <text class="muted" x="460" y="260">+ trace 실측값</text>
  </g>
  <line class="arrow" x1="320" y1="260" x2="320" y2="304" marker-end="url(#arrow)"/>

  <!-- Stage 4 (Core loop) -->
  <g>
    <rect class="box-core" x="60" y="306" width="520" height="160" rx="10"/>
    <text x="320" y="330" text-anchor="middle" class="step-title" fill="#712b13">④ PoC 자동 생성 + Foundry 검증 루프 — Core</text>
    <text x="320" y="350" text-anchor="middle" class="step-sub" fill="#993c1d">결정론 · 추론 · 검증을 한 루프 안에서 교차</text>

    <g>
      <rect class="box-core" x="78" y="370" width="118" height="46" rx="6"/>
      <text x="137" y="391" text-anchor="middle" class="step-sub" fill="#993c1d">Sketch 생성</text>
      <text x="137" y="407" text-anchor="middle" class="step-sub" fill="#993c1d">(결정론)</text>
    </g>
    <line class="arrow" stroke="#993c1d" x1="196" y1="393" x2="220" y2="393" marker-end="url(#arrow)"/>

    <g>
      <rect class="box-core" x="222" y="370" width="118" height="46" rx="6"/>
      <text x="281" y="391" text-anchor="middle" class="step-sub" fill="#993c1d">AI refinement</text>
      <text x="281" y="407" text-anchor="middle" class="step-sub" fill="#993c1d">(추론)</text>
    </g>
    <line class="arrow" stroke="#993c1d" x1="340" y1="393" x2="364" y2="393" marker-end="url(#arrow)"/>

    <g>
      <rect class="box-core" x="366" y="370" width="118" height="46" rx="6"/>
      <text x="425" y="391" text-anchor="middle" class="step-sub" fill="#993c1d">forge test 실행</text>
      <text x="425" y="407" text-anchor="middle" class="step-sub" fill="#993c1d">(검증)</text>
    </g>
    <line class="arrow" stroke="#993c1d" x1="484" y1="393" x2="508" y2="393" marker-end="url(#arrow)"/>

    <g>
      <rect class="box-out" x="510" y="370" width="56" height="46" rx="6"/>
      <text x="538" y="391" text-anchor="middle" class="step-sub" fill="#0f6e56">Pass</text>
      <text x="538" y="407" text-anchor="middle" class="step-sub" fill="#0f6e56">→ ⑤</text>
    </g>

    <path class="loop-arrow" d="M425 416 L425 438 L137 438 L137 416" marker-end="url(#arrow)"/>
    <text x="281" y="455" text-anchor="middle" class="step-sub" fill="#993c1d">실패 시 에러 피드백 → 재시도</text>
  </g>

  <line class="arrow" x1="320" y1="466" x2="320" y2="506" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <g>
    <rect class="box-step" x="220" y="508" width="200" height="44" rx="8"/>
    <text x="320" y="526" text-anchor="middle" class="step-title" fill="#0c447c">⑤ 근본 원인 분석</text>
    <text x="320" y="544" text-anchor="middle" class="step-sub" fill="#185fa5">파일:라인 단위 도출</text>
  </g>
  <g>
    <rect class="box-tool" x="450" y="502" width="190" height="56" rx="6"/>
    <text class="tag"   x="460" y="520">Source</text>
    <text class="muted" x="460" y="536">Etherscan verified</text>
    <text class="muted" x="460" y="552">source code</text>
  </g>
  <line class="arrow" x1="320" y1="552" x2="320" y2="592" marker-end="url(#arrow)"/>

  <!-- Final output -->
  <text class="tag" x="40" y="610">Output</text>
  <g>
    <rect class="box-out" x="220" y="594" width="200" height="56" rx="8"/>
    <text x="320" y="614" text-anchor="middle" class="step-title" fill="#085041">감사 보고서</text>
    <text x="320" y="632" text-anchor="middle" class="step-sub" fill="#0f6e56">검증된 PoC + 근본 원인 + 패치 방향</text>
  </g>

  <!-- Legend -->
  <line x1="60" y1="690" x2="640" y2="690" stroke="#d3d1c7" stroke-width="0.5"/>
  <text class="tag" x="60" y="710">Legend</text>

  <rect class="box-step" x="60"  y="722" width="14" height="14" rx="3"/>
  <text class="muted" x="82"  y="733">결정론 단계</text>

  <rect class="box-core" x="180" y="722" width="14" height="14" rx="3"/>
  <text class="muted" x="202" y="733">하이브리드 (검증 루프)</text>

  <rect class="box-out"  x="360" y="722" width="14" height="14" rx="3"/>
  <text class="muted" x="382" y="733">검증된 최종 산출</text>

  <rect class="box-tool" x="500" y="722" width="14" height="14" rx="3"/>
  <text class="muted" x="522" y="733">외부 도구/리소스</text>
</svg>
